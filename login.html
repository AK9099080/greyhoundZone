<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-scan" aria-hidden="true"></div>

  <main class="login-wrap">
    <div class="login-card">
      <p class="login-eyebrow">// restricted</p>
      <h1 class="login-title">sign in</h1>

      <form id="login-form" class="login-form">
        <label class="login-label" for="username">username</label>
        <input class="login-input" type="text" id="username" name="username" autocomplete="off" required>

        <label class="login-label" for="password">password</label>
        <input class="login-input" type="password" id="password" name="password" autocomplete="off" required>

        <button type="submit" class="login-btn">enter →</button>
      </form>

      <p class="login-hint">any credentials will do here.</p>
    </div>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      // No real authentication — any username/password combination proceeds.
      window.location.href = 'hub.html';
    });
  </script>

</body>
</html>
