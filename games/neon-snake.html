<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Snake</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:#0b0e14; color:#ffd166; font-family:'JetBrains Mono', monospace; }
  h1 { text-shadow:0 0 16px rgba(255,209,102,.5); letter-spacing:.06em; }
  canvas { background:#0e1420; border:1px solid rgba(255,209,102,.3); box-shadow:0 0 30px rgba(255,209,102,.15); }
  p { color:#7d8b93; font-size:.85rem; }
  a { color:#ff4fa3; }
</style>
</head>
<body>
<h1>NEON SNAKE</h1>
<canvas id="c" width="320" height="320"></canvas>
<p>Arrow keys to steer</p>
<p><a href="../hub.html">← back to hub</a></p>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d'), g=16;
let snake=[{x:8,y:8}], dir={x:1,y:0}, food={x:14,y:14}, alive=true;
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowUp' && dir.y!==1) dir={x:0,y:-1};
  if(e.key==='ArrowDown' && dir.y!==-1) dir={x:0,y:1};
  if(e.key==='ArrowLeft' && dir.x!==1) dir={x:-1,y:0};
  if(e.key==='ArrowRight' && dir.x!==-1) dir={x:1,y:0};
});
function tick(){
  if(!alive) return;
  const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=20||head.y>=20|| snake.some(s=>s.x===head.x&&s.y===head.y)){ alive=false; return; }
  snake.unshift(head);
  if(head.x===food.x && head.y===food.y){ food={x:Math.floor(Math.random()*20), y:Math.floor(Math.random()*20)}; }
  else snake.pop();
  ctx.fillStyle='#0e1420'; ctx.fillRect(0,0,320,320);
  ctx.fillStyle='#ff4fa3'; ctx.fillRect(food.x*g, food.y*g, g-2, g-2);
  ctx.fillStyle='#ffd166';
  snake.forEach(s=>ctx.fillRect(s.x*g, s.y*g, g-2, g-2));
  setTimeout(tick, 100);
}
tick();
</script>
</body>
</html>
