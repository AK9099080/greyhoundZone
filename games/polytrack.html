<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyTrack</title>
    <style>
        /* Remove default browser margins and hide scrollbars on the main page */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* Optional: Sets a background color while loading */
        }

        /* Force the iframe to occupy 100% of the visible viewport */
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://ak9099080.github.io/polytrack0.6.0/" 
        allow="fullscreen; geolocation; microphone; camera">
    </iframe>

</body>
</html>
